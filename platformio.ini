; OpenCubeWorld - PlatformIO configuration
; Default target: Waveshare ESP32-S3-LCD-1.54 / ESP32-S3-Touch-LCD-1.54
; (ESP32-S3R8, 16 MB QIO Flash, 8 MB OPI PSRAM, 240x240 ST7789 SPI LCD,
;  QMI8658 6-axis IMU, 3 physical buttons, optional CST816 capacitive touch)

[platformio]
default_envs = waveshare_esp32s3_lcd_154
src_dir = firmware/pio_entry

[env:waveshare_esp32s3_lcd_154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_extra_dirs = firmware/libraries
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOCW_BOARD_WAVESHARE_ESP32S3_LCD_154

[env:waveshare_cubelink]
extends = env:waveshare_esp32s3_lcd_154
build_flags =
  ${env:waveshare_esp32s3_lcd_154.build_flags}
  -DOCW_SKETCH_CUBELINK

[env:waveshare_replay_dodger]
extends = env:waveshare_esp32s3_lcd_154
build_flags =
  ${env:waveshare_esp32s3_lcd_154.build_flags}
  -DOCW_SKETCH_REPLAY_DODGER
